name: illumos-build

on:
  push:
    branches: [ 'illumos/**' ]
    # release tags are prefixed to stay clear of upstream ClickHouse version tags.
    tags: [ 'illumos-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-illumos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # 5.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Build ClickHouse in OmniOS VM
        uses: vmactions/omnios-vm@7f2be0b927aad1a78498c8aeeac4c4ce1fabd322 # v1.3.3
        with:
          release: r151058
          mem: 13312
          prepare: |
            pkg install ooce/developer/clang-21 ooce/developer/llvm-21 ooce/developer/cmake ooce/developer/ninja \
              runtime/python-313 file/gnu-findutils text/gnu-grep
            # illumos does not overcommit memory: compiler VA peaks must be
            # backed by RAM+swap, and the image has little swap.
            swap -sh
            zfs create -V 8G rpool/swap2
            swap -a /dev/zvol/dsk/rpool/swap2
            swap -sh
          # Build outside the workspace so copyback only returns out/.
          run: |
            set -e
            export PATH=/usr/gnu/bin:/opt/ooce/bin:$PATH
            SRC=$PWD
            VERSION=$(sed -n 's/^SET(VERSION_STRING \(.*\))$/\1/p' "$SRC/cmake/autogenerated_versions.txt")

            mkdir -p /var/tmp/build && cd /var/tmp/build
            cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCOMPILER_CACHE=disabled \
                -DCMAKE_C_COMPILER=/opt/ooce/bin/clang-21 \
                -DCMAKE_CXX_COMPILER=/opt/ooce/bin/clang++-21 \
                -DPARALLEL_COMPILE_JOBS=4 \
                -DPARALLEL_LINK_JOBS=1 \
                -DENABLE_LIBRARIES=OFF \
                -DENABLE_RUST=OFF \
                -DENABLE_TESTS=OFF \
                -DENABLE_YAML_CPP=ON \
                -DENABLE_ICU=ON \
                -DENABLE_DATASKETCHES=ON \
                -DENABLE_ANTLR4_CPP_RUNTIME=ON \
                -DENABLE_ANTLR4_GRAMMARS=ON \
                -DENABLE_NURAFT=ON \
                "$SRC"
            ninja clickhouse

            mkdir -p /var/tmp/dist
            cp programs/clickhouse /var/tmp/dist/clickhouse
            /usr/bin/strip -x /var/tmp/dist/clickhouse
            /var/tmp/dist/clickhouse local --query "SELECT version()"
            cp "$SRC/programs/server/config.xml" "$SRC/programs/server/users.xml" /var/tmp/dist/

            mkdir -p "$SRC/out"
            tar czf "$SRC/out/clickhouse-$VERSION.illumos.tar.gz" -C /var/tmp/dist clickhouse config.xml users.xml

      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # 4.6.1
        with:
          name: clickhouse-illumos
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/illumos-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "$GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
